<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ghifarion — Engineering Intelligence. Building Legacy.</title>
  <desc id="desc">A dark neural-purple banner with an abstract glowing orbital network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090817"/>
      <stop offset="0.58" stop-color="#15102d"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <linearGradient id="neural" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4263ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="900" cy="170" r="210" fill="url(#glow)"/>
  <circle cx="900" cy="170" r="120" fill="#4263ff" opacity=".12" filter="url(#blur)"/>
  <g fill="none" stroke="url(#neural)" stroke-width="1.5" opacity=".72">
    <ellipse cx="920" cy="175" rx="220" ry="72" transform="rotate(-28 920 175)"/>
    <ellipse cx="920" cy="175" rx="220" ry="72" transform="rotate(28 920 175)"/>
    <ellipse cx="920" cy="175" rx="160" ry="120" transform="rotate(90 920 175)"/>
    <path d="M720 250 L810 130 L900 185 L1000 80 L1115 180 L1045 275 L920 175 L800 285 Z" opacity=".6"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="810" cy="130" r="4"/><circle cx="900" cy="185" r="5"/><circle cx="1000" cy="80" r="4"/>
    <circle cx="1115" cy="180" r="4"/><circle cx="1045" cy="275" r="4"/><circle cx="720" cy="250" r="3"/>
  </g>
  <path d="M70 64 H126" stroke="url(#neural)" stroke-width="4" stroke-linecap="round"/>
  <text x="70" y="150" fill="#f5f3ff" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">GHIFARION</text>
  <text x="72" y="196" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500">Engineering Intelligence.</text>
  <text x="72" y="228" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="500">Building Legacy.</text>
  <text x="72" y="290" fill="#a8a1c2" font-family="JetBrains Mono,Consolas,monospace" font-size="12" letter-spacing="2">AI ENGINEERING  /  AUTOMATION  /  PRODUCT BUILDING</text>
</svg>